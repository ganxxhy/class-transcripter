<title>Mis clases</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access"]}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Estudio · panel "Mis clases" con el diseño "Jornada": el cielo sigue la hora real, tarjetas blancas y el día como un arco con el sol. */
@property --bg-a{syntax:'<color>';inherits:true;initial-value:#8EC5FF}
@property --bg-b{syntax:'<color>';inherits:true;initial-value:#CFE6FF}
@property --bg-c{syntax:'<color>';inherits:true;initial-value:#F3F8FF}
:root{--ink:#0D2340;--mute:#54657B;--paper:#F5F9FE;--card:#FFFFFF;--line:#E3EBF4;--sun:#FF7A2F;--blue:#2563EB;--sky-c:#F3F8FF;
 --ok:#16A34A;--ok-bg:#E8F7EE;--ok-ink:#14632F;--now:#E0560F;--warn-bg:#FFF4E5;--warn-ink:#8A4B00;--danger:#B42318;--danger-bg:#FFF5F4;
 --on-sky:#0D2340;--on-sky-mute:#3F5068;--stars:0;--ease:cubic-bezier(.2,.8,.2,1);
 --disp:"Bricolage Grotesque","Segoe UI",ui-sans-serif,system-ui,sans-serif;--ui:"Figtree","Segoe UI",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
 transition:--bg-a 1.2s,--bg-b 1.2s,--bg-c 1.2s;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:var(--bg-c)}
body{margin:0;min-height:100dvh;font-family:var(--ui);font-size:14.5px;line-height:1.45;color:var(--ink);background:linear-gradient(180deg,var(--bg-a) 0,var(--bg-b) 50%,var(--bg-c) 100%) fixed}
body::after{content:"";position:fixed;inset:0 0 40% 0;pointer-events:none;z-index:-1;opacity:var(--stars);transition:opacity 1.2s;
 background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 27% 8%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 41% 26%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 58% 12%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 73% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 6%,#fff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 93% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 5% 38%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 35% 44%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 66% 40%,#fff 50%,transparent 51%)}
::selection{background:#FFD2A8;color:#0D2340}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Barra superior */
.top{display:flex;align-items:center;gap:16px;padding-block:18px}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--on-sky)}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#FFD2A8 0,var(--sun) 55%,#F25F1A 100%);box-shadow:0 0 18px rgba(255,122,47,.6)}
.brand small{font-family:var(--ui);font-weight:550;font-size:14px;letter-spacing:0;color:var(--on-sky-mute)}
.dock{margin:0 auto;display:flex;gap:4px;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 1px 2px rgba(13,35,64,.06),0 8px 24px -12px rgba(13,35,64,.25)}
.dock a,.tabbar a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--mute);font-weight:550;transition:background .15s,color .15s}
.dock a:hover{color:var(--ink);background:var(--sky-c)}
.dock a[aria-current="page"],.tabbar a[aria-current="page"]{background:var(--ink);color:#fff}
.me{display:flex;align-items:center;gap:10px;font-weight:550}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;box-shadow:0 8px 24px -14px rgba(13,35,64,.35);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live i{width:8px;height:8px;border-radius:50%;background:#9AA9BC;flex:none}
.live.on i{background:#E5484D;box-shadow:0 0 0 0 rgba(229,72,77,.5);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}}
.av{width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 0 0 2px #fff,0 4px 10px -4px rgba(13,35,64,.3);flex:none}
.tabbar{display:none}

/* Avisos */
.notes{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.note{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 14px 12px 16px;border-radius:16px;background:var(--card);font-size:13.5px;box-shadow:0 1px 2px rgba(13,35,64,.05),0 18px 40px -30px rgba(13,35,64,.35)}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.info{background:#EAF2FF}
.note input[type=text]{border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:40px;background:#fff;color:var(--ink)}
.note-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk-inline{display:inline-flex;gap:6px;align-items:center;color:var(--mute);font-size:13px;cursor:pointer}
.chk-inline input{accent-color:var(--ink);width:16px;height:16px}

/* Genérico */
.page{padding-bottom:48px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0 22px}
.head h1{font-family:var(--disp);font-weight:650;font-size:clamp(30px,4vw,44px);letter-spacing:-.035em;line-height:1.02;text-wrap:balance;color:var(--on-sky)}
.head p{color:var(--on-sky-mute);margin-top:6px;max-width:60ch}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--on-sky-mute);text-decoration:none;font-weight:550;margin-bottom:10px}
.crumb:hover{color:var(--on-sky)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 1px 2px rgba(13,35,64,.05),0 18px 40px -28px rgba(13,35,64,.35);min-width:0}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.card h2{font-family:var(--disp);font-weight:650;font-size:19px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.card h2 span,.card h2 a{font-family:var(--ui);font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;text-decoration:none}
.card h2 a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:650;transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap;min-height:44px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:#fff;box-shadow:0 8px 18px -10px rgba(13,35,64,.7)}
.btn.pri:hover{background:#17365F}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(13,35,64,.08),inset 0 0 0 1px var(--line)}
.btn.sec:hover{background:var(--sky-c)}
.btn.sm{padding:7px 14px;min-height:38px;font-size:13.5px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg);box-shadow:inset 0 0 0 1px #F4C7C3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg.i{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c,#54657B) 14%,white);color:color-mix(in srgb,var(--c,#54657B) 60%,#0D2340);white-space:nowrap}
.pill.hot{--c:#E0560F}.pill.ok{--c:#16A34A}.pill.red{--c:#B42318}
.empty{padding:22px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:16px}
.t-sub{font-size:12.5px;color:var(--mute);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.t-sub a{color:inherit;text-underline-offset:2px}

/* Arco del día */
.hero{text-align:center;position:relative;padding-top:4px}
.arc{width:100%;max-width:980px;height:auto;display:block;margin:0 auto;overflow:visible}
.arc .seg{fill:none;stroke-width:18;stroke-linecap:round}
.arc .seg.todo{opacity:.32}
.arc .track{fill:none;stroke:rgba(255,255,255,.7);stroke-width:18;stroke-linecap:round}
.arc text{font-family:var(--mono);font-size:13px;fill:var(--on-sky-mute)}
.arc .lab{font-family:var(--ui);font-weight:600;fill:var(--on-sky)}
.sun{animation:glow 4s ease-in-out infinite}@keyframes glow{50%{opacity:.75}}
.hero-copy{position:absolute;left:50%;top:52%;transform:translate(-50%,-30%);width:min(560px,72%);display:flex;flex-direction:column;align-items:center;gap:10px}
.now{font-size:13.5px;color:var(--on-sky-mute);font-weight:550;display:flex;align-items:center;gap:8px}
.now i{width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px rgba(255,122,47,.2)}
.hero h1{font-family:var(--disp);font-weight:650;font-size:clamp(28px,4.2vw,50px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance;color:var(--on-sky)}
.timer{font-family:var(--mono);font-size:14px;color:var(--on-sky-mute)}
.timer b{color:var(--on-sky);font-weight:600}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;padding:8px 0 24px;color:var(--on-sky);font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* Tareas (lo importante que se dice en clase) */
.task{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0;padding-top:0}
.chk{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);display:grid;place-items:center;color:#fff;transition:background .15s}
.chk svg.i{width:13px;height:13px;opacity:0}
.task.done .chk{background:var(--c)}.task.done .chk svg.i{opacity:1}
.chk:disabled{cursor:default;opacity:.6}
.task.done .t-title{text-decoration:line-through;color:var(--mute)}
.t-title{font-weight:600;overflow-wrap:anywhere}
.t-det{font-size:13px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
.cita{font-size:13px;color:var(--mute);font-style:italic;margin-top:4px;padding-left:8px;border-left:2px solid var(--line)}
.seg-ctl{display:inline-flex;flex-wrap:wrap;background:var(--card);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.seg-ctl button{padding:7px 14px;border-radius:999px;font-weight:600;color:var(--mute);min-height:36px}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;color:var(--ink);font-weight:500;font-size:14.5px}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.opt-row:first-child{border-top:0;padding-top:0}

/* Clases de hoy */
.cls{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.cls:first-child{border-top:0;padding-top:0}
.cls time{font-family:var(--mono);font-size:12.5px;color:var(--mute);line-height:1.35}
.cls time b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.cls .nm{font-weight:650;display:flex;align-items:center;gap:8px}
.cls .nm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cls.is-past .nm,.cls.is-past time b{color:var(--mute)}
.cls.is-now{background:var(--sky-c);margin:0 -12px;padding:11px 12px;border-radius:14px;border-top-color:transparent}
.cls.is-now + .cls{border-top-color:transparent}

/* Asignaturas y clases */
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.subj{display:flex;flex-direction:column;gap:12px;text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s}
.subj:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(13,35,64,.05),0 22px 44px -26px rgba(13,35,64,.45)}
.subj-top{display:flex;align-items:center;gap:12px;min-width:0}
.code{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:#fff;background:var(--c);flex:none}
.code.sm{width:34px;height:34px;border-radius:10px;font-size:11px}
.subj h3{font-family:var(--disp);font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.subj small{color:var(--mute);font-size:13px}
.bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:99px}
.subj-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.subj-meta b{color:var(--ink)}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 12px;margin:0 -12px;border-radius:14px;text-decoration:none;transition:background .15s}
.rec + .rec{border-top:1px solid var(--line)}
.rec > span{min-width:0}
.rec:hover{background:var(--sky-c)}
.rec .date{width:52px;text-align:center;border-radius:12px;background:var(--sky-c);padding:6px 0;line-height:1.1}
.rec .date b{display:block;font-family:var(--disp);font-size:20px}
.rec .date span{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.rec h3{font-size:15.5px;font-weight:650;overflow-wrap:anywhere}
.rec p{font-size:13px;color:var(--mute)}
.state{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.state.wait i{background:#E0A100}.state.live i{background:#E5484D}.state.err i{background:var(--danger)}.state.none i{background:#9AA9BC}
.chev{color:var(--mute)}

/* Resumen de una clase */
.sum-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.prose{font-size:15.5px;line-height:1.6;max-width:70ch}
.prose h3{font-family:var(--disp);font-size:18px;letter-spacing:-.015em;margin:22px 0 8px}
.prose h3:first-child{margin-top:0}
.prose p{margin:0 0 10px}
.prose ul{display:flex;flex-direction:column;gap:8px}
.prose li{padding-left:18px;position:relative}
.prose li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.terms dt{font-weight:650;margin-top:12px}.terms dt:first-child{margin-top:0}
.terms dd{margin:2px 0 0;color:var(--mute)}
.meta-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.meta-list li:first-child{border-top:0;padding-top:0}
.meta-list span{color:var(--mute)}
.meta-list b{font-weight:600;text-align:right}
.acts{display:flex;flex-direction:column;gap:10px}
.acts .field select{min-height:40px}
.trans-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.trans-tools input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;color:var(--ink)}
.trans{display:grid;gap:4px;font-size:14px;max-height:70vh;overflow:auto;padding-right:4px}
.trans div{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:3px 6px;border-radius:8px}
.trans time{font-family:var(--mono);font-size:12px;color:var(--mute);padding-top:2px}
.trans mark{background:#FFD2A8;color:inherit;border-radius:3px}
.trans .hl{background:color-mix(in srgb,var(--c) 12%,white)}

/* Calendario */
.tt-wrap{overflow-x:auto;overflow-y:hidden;padding:8px 0 4px}
.tt{display:grid;min-width:640px}
.tt .hd{font-weight:650;padding:0 8px 10px;font-size:13.5px}
.tt .hd.today{color:var(--now)}
.tt .hours,.tt .tcol{position:relative}
.tt .hours span{position:absolute;font-family:var(--mono);font-size:11.5px;color:var(--mute);transform:translateY(-50%)}
.tt .tcol{border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.tt .tcol.today{background-color:rgba(255,122,47,.05)}
.blk{position:absolute;left:5px;right:5px;border:0;text-align:left;cursor:pointer;border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,white);color:color-mix(in srgb,var(--c) 70%,#0D2340);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,white);transition:box-shadow .15s,transform .12s}
.blk:hover{box-shadow:inset 0 0 0 1.5px var(--c)}
.blk.sel{box-shadow:inset 0 0 0 2px var(--c),0 6px 16px -8px rgba(13,35,64,.4)}
.blk b{display:block;font-weight:700}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--sun);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--sun)}
.cls-detail{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,white);margin-bottom:14px}
.cls-detail b{font-family:var(--disp);font-size:17px}
.hint{font-size:13px;margin:-6px 0 12px;color:var(--mute)}
.dayview{display:none}
.daytabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sky-c);border-radius:999px;padding:4px;margin-bottom:12px}
.daytabs button{border-radius:999px;padding:8px 0;font-weight:650;color:var(--mute);min-height:40px}
.daytabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.mcal b{font-weight:600;color:var(--mute);padding-bottom:2px}
.mcal span{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;position:relative}
.mcal span.today{background:var(--ink);color:#fff;font-weight:700}
.mcal span.ev::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.mcal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:650}
.mcal-head button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.mcal-head button:hover{background:var(--sky-c);color:var(--ink)}

/* Estadísticas */
.st-head{display:flex;gap:28px;margin-bottom:10px;flex-wrap:wrap}
.st-head div{display:flex;flex-direction:column}
.st-head b{font-family:var(--disp);font-size:30px;letter-spacing:-.03em;line-height:1.05;font-weight:650}
.st-head span{color:var(--mute);font-size:13px}
.area{width:100%;height:auto;display:block}
.area text{font-family:var(--ui);font-size:12px;fill:var(--mute)}
.ins li{background:var(--sky-c);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:10px}
.ins li:first-child{margin-top:0}

<script>
const VERSION_PANEL = "1.1.2"; // súbela al cambiar este archivo: el agente avisa a los paneles más viejos

/* ---------- Cielo (sky.js del diseño, en línea porque el panel es un único archivo) ---------- */
(function(){
const CITIES={'auto':null,'Madrid':[40.42,-3.70],'Barcelona':[41.39,2.17],'Zaragoza':[41.65,-0.88],'Valencia':[39.47,-0.38],'Sevilla':[37.39,-5.98],'Bilbao':[43.26,-2.93],'Las Palmas':[28.12,-15.43],
 'Lisboa':[38.72,-9.14],'Londres':[51.51,-0.13],'París':[48.86,2.35],'Berlín':[52.52,13.40],'Roma':[41.90,12.50],
 'Ciudad de México':[19.43,-99.13],'Bogotá':[4.71,-74.07],'Lima':[-12.05,-77.04],'Santiago':[-33.45,-70.66],'Buenos Aires':[-34.60,-58.38],'Nueva York':[40.71,-74.01],'Los Ángeles':[34.05,-118.24],'Tokio':[35.68,139.69],'Sídney':[-33.87,151.21]};
const TZ={'Europe/Madrid':'Madrid','Atlantic/Canary':'Las Palmas','Europe/Lisbon':'Lisboa','Europe/London':'Londres','Europe/Paris':'París','Europe/Berlin':'Berlín','Europe/Rome':'Roma','America/Mexico_City':'Ciudad de México','America/Bogota':'Bogotá','America/Lima':'Lima','America/Santiago':'Santiago','America/Argentina/Buenos_Aires':'Buenos Aires','America/New_York':'Nueva York','America/Los_Angeles':'Los Ángeles','Asia/Tokyo':'Tokio','Australia/Sydney':'Sídney'};
const tz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return''}})();
function autoPlace(){
 if(TZ[tz]) return {name:TZ[tz], ll:CITIES[TZ[tz]], how:'zona horaria '+tz};
 const off=-new Date().getTimezoneOffset();
 return {name:'tu zona horaria', ll:[40, off/4], how:'desfase UTC'+(off>=0?'+':'')+(off/60)};
}
function sunAlt(ms,lat,lon){
 const r=Math.PI/180,d=ms/864e5-10957.5,g=(357.529+.98560028*d)*r,q=280.459+.98564736*d;
 const L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*r,e=(23.439-3.6e-7*d)*r;
 const dec=Math.asin(Math.sin(e)*Math.sin(L)),ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L));
 const gmst=((18.697374558+24.06570982441908*d)%24+24)%24,H=(gmst*15+lon)*r-ra;
 return Math.asin(Math.sin(lat*r)*Math.sin(dec)+Math.cos(lat*r)*Math.cos(dec)*Math.cos(H))/r;
}
const K=[[-90,'#060B1A','#0B1530','#14223F'],[-14,'#08122A','#11204A','#1D2F5C'],[-7,'#0E1F4A','#25407A','#4A64A0'],[-2.5,'#1E3F7A','#4F6FA8','#E9946A'],[2,'#4F84C8','#E9AE86','#FFD0A6'],[8,'#74AEEB','#BFD7F2','#F8E5CF'],[20,'#8EC5FF','#CFE6FF','#F3F8FF'],[90,'#86C0FF','#CBE4FF','#F3F8FF']];
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
function colors(alt){let i=0;while(i<K.length-2&&alt>K[i+1][0])i++;const a=K[i],b=K[i+1],t=Math.max(0,Math.min(1,(alt-a[0])/(b[0]-a[0])));return[1,2,3].map(j=>mix(a[j],b[j],t))}
const S={city:lsGet('sky-city')||'auto',preview:null};
function place(){return S.city!=='auto'&&CITIES[S.city]?{name:S.city,ll:CITIES[S.city],how:'elegida por ti'}:autoPlace()}
function when(){if(S.preview==null)return new Date();const d=new Date();d.setHours(Math.floor(S.preview),Math.round(S.preview%1*60),0,0);return d}
function apply(){
 const p=place(),t=when(),alt=sunAlt(t.getTime(),p.ll[0],p.ll[1]),[a,b,c]=colors(alt),root=document.documentElement.style;
 root.setProperty('--bg-a',a);root.setProperty('--bg-b',b);root.setProperty('--bg-c',c);
 const dark=alt<-1;root.setProperty('--on-sky',dark?'#F2F5FA':'#0D2340');root.setProperty('--on-sky-mute',dark?'#B9C6DA':'#3F5068');
 root.setProperty('--stars',String(Math.max(0,Math.min(1,(-alt-4)/10))));
 document.documentElement.dataset.sky=dark?'night':alt<8?'golden':'day';
 const hh=t.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
 const phase=alt<-12?'Noche':alt<-1?(t.getHours()<12?'Amanecer':'Anochecer'):alt<8?(t.getHours()<12?'Mañana temprana':'Atardecer'):'Día';
 document.querySelectorAll('[data-sky-label]').forEach(el=>el.textContent=`${phase} · ${hh} · ${p.name}`);
 document.querySelectorAll('[data-sky-how]').forEach(el=>el.textContent=S.preview==null?`Hora real de tu dispositivo. Ubicación: ${p.name} (${p.how}).`:`Vista previa a las ${hh} en ${p.name}.`);
 document.querySelectorAll('[data-sky-range]').forEach(el=>{if(S.preview==null){const n=new Date();el.value=n.getHours()+n.getMinutes()/60}});
}
window.Sky={cities:Object.keys(CITIES),get city(){return S.city},
 setCity(c){S.city=c;lsSet('sky-city',c);apply()},preview(h){S.preview=h;apply()},live(){S.preview=null;apply()},apply};
apply();setInterval(()=>{if(S.preview==null)apply()},60000);
const btn=$('#sky-btn'),panel=$('#skypanel'),sel=$('#sky-city');
sel.innerHTML=Sky.cities.map(c=>`<option value="${esc(c)}">${c==='auto'?'Automática (por tu zona horaria)':esc(c)}</option>`).join('');sel.value=Sky.city;
btn.addEventListener('click',()=>{panel.hidden=!panel.hidden;btn.setAttribute('aria-expanded',String(!panel.hidden))});
sel.addEventListener('change',()=>Sky.setCity(sel.value));

})();

/* ---------- Iconos ---------- */
const P = { home: '<path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/>', book: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H20v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H20"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>', cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  chart: '<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>', check: '<path d="m5 12.5 4.2 4.2L19 7"/>', back: '<path d="M19 12H5M11 6l-6 6 6 6"/>', chev: '<path d="m9 6 6 6-6 6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>', mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>', doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>', prev: '<path d="m15 6-6 6 6 6"/>' };
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ""}</svg>`;

/* ---------- Estado ---------- */
let db = null, mcp = null, sample = null, hostOK = false;
let GEN = { asignaturas: [], horario: [], agente: null, sincronizado: null, nombre: "" };
let CLASES = [], MAPA = {}, HECHOS = new Set(), cargado = false;
let filtro = "pend";
const asig = (id) => GEN.asignaturas.find((a) => a.id === id) || { id, nombre: id || "Sin asignatura", color: "#475569" };
const hoy = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtFecha = (iso) => new Date(iso + (iso.length === 10 ? "T00:00" : "")).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
const fmtHora = (iso) => new Date(iso).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
const fmtDur = (s) => s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.round(s % 3600 / 60)).padStart(2, "0")}` : `${Math.max(1, Math.round(s / 60))} min`;
const fmtH = (s) => { const h = s / 3600; return h >= 10 ? `${Math.round(h)} h` : `${String(Math.round(h * 10) / 10).replace(".", ",")} h`; };
const mmss = (t) => `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const hace = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "ahora mismo" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `el ${fmtFecha(iso.slice(0, 10))}`; };
const TIPOS = { examen: "Examen", trabajo: "Trabajo", entrega: "Entrega", fecha: "Fecha", aviso: "Aviso", comentario: "Comentario" };
const TIPO_C = { examen: "#B42318", trabajo: "#E0560F", entrega: "#E0560F", fecha: "#2563EB", aviso: "#475569", comentario: "#0E9F8E" };
const TAREA = ["examen", "trabajo", "entrega"];
const NORM = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const DIAS_N = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
const DIA_CORTO = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const h2n = (t) => { const [a, b] = String(t || "0:0").split(":").map(Number); return (a || 0) + (b || 0) / 60; };
const ahoraH = () => { const n = new Date(); return n.getHours() + n.getMinutes() / 60; };
const slotDow = (h) => DIAS_N.indexOf(NORM(h.dia));
const PALABRAS_VACIAS = new Set(["de", "del", "la", "las", "el", "los", "y", "e", "a", "en", "para", "con", "al"]);
function codigo(a) {
  const ws = String(a.nombre || a.id || "").normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[\s\-_/]+/)
    .filter((w) => w && !PALABRAS_VACIAS.has(w.toLowerCase()) && !/^([ivx]+|\d+)$/i.test(w));
  const c = ws.length >= 2 ? ws.slice(0, 3).map((w) => w[0]).join("") : (ws[0] || a.id || "?").slice(0, 3);
  return c.toUpperCase();
}
function asignaturasIds() {
  return [...GEN.asignaturas.map((a) => a.id), ...new Set(CLASES.map((c) => c.asignatura).filter((id) => id && !GEN.asignaturas.some((a) => a.id === id)))];
}
const clasesDe = (id) => CLASES.filter((c) => c.asignatura === id);
const urlClase = (id) => "#clase=" + encodeURIComponent(id);

function destacados() {
  const out = [];
  for (const c of CLASES) (c.resumen?.destacados || []).forEach((d, i) => out.push({ ...d, clase: c, clave: `${c.id}~${i}` }));
  return out;
}
function cuando(d) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha_iso || "")) return { txt: "Sin fecha", dias: null };
  const f = new Date(d.fecha_iso + "T00:00"), dias = Math.round((f - hoy()) / 864e5);
  const txt = dias === 0 ? "Hoy" : dias === 1 ? "Mañana" : dias > 1 && dias < 7 ? f.toLocaleDateString("es-ES", { weekday: "long" }).replace(/^./, (x) => x.toUpperCase())
    : dias >= 7 ? f.toLocaleDateString("es-ES", { day: "numeric", month: "short" }) : `${f.toLocaleDateString("es-ES", { day: "numeric", month: "short" })} · pasado`;
  return { txt, dias };
}
const vigente = (d) => !HECHOS.has(d.clave) && !(cuando(d).dias < 0);
const pesoD = (d) => { const w = cuando(d); return w.dias === null ? 1e6 - new Date(d.clase.inicio) / 1e9 : w.dias < 0 ? 2e6 - w.dias : w.dias; };

/* Horario: siguiente vez que toca una franja, contando desde ahora */
function proximaVez(h) {
  const dow = slotDow(h); if (dow < 0) return null;
  const n = new Date(); let dias = (dow - n.getDay() + 7) % 7;
  if (dias === 0 && h2n(h.inicio) <= ahoraH()) dias = 7;
  return { dias, h };
}
function txtProxima(p) { return !p ? "—" : p.dias === 0 ? `hoy ${p.h.inicio}` : p.dias === 1 ? `mañana ${p.h.inicio}` : `${DIA_CORTO[slotDow(p.h)]} ${p.h.inicio}`; }
function franjasHoy() { const d = new Date().getDay(); return GEN.horario.filter((h) => slotDow(h) === d).sort((a, b) => h2n(a.inicio) - h2n(b.inicio)); }
/* Clase grabada que corresponde a una franja de hoy */
function grabadaDe(h) {
  const iso = isoLocal(new Date());
  return CLASES.find((c) => c.fecha === iso && c.asignatura === h.asignatura && (() => { const t = new Date(c.inicio); const x = t.getHours() + t.getMinutes() / 60; return x >= h2n(h.inicio) - .5 && x < h2n(h.fin); })());
}
function agenteVivo() { const ag = GEN.agente; return ag && ag.actualizado && (Date.now() - new Date(ag.actualizado)) < 3 * 60000 ? ag : null; }
function grabandoAhora() { const ag = agenteVivo(); return hostOK && ag && ag.activo && ag.clase_id ? ag : null; }

/* ---------- Piezas compartidas ---------- */
function filaTarea(d, { clase = true } = {}) {
  const a = asig(d.clase.asignatura), w = cuando(d), hecho = HECHOS.has(d.clave);
  const pill = `<span class="pill${w.dias === 0 ? " hot" : ""}" style="--c:${TIPO_C[d.tipo] || "#475569"}">${esc(TIPOS[d.tipo] || d.tipo)} · ${esc(w.txt)}</span>`;
  return `<li class="task${hecho ? " done" : ""}" style="--c:${color(a.color)}">
    <button class="chk" type="button" data-hecho="${esc(d.clave)}" aria-pressed="${hecho}" aria-label="Marcar «${esc(d.titulo)}» como hecho" ${db ? "" : "disabled"}>${ic("check")}</button>
    <div><div class="t-title">${esc(d.titulo)}</div>${d.detalle ? `<div class="t-det">${esc(d.detalle)}</div>` : ""}
      ${!clase && d.cita ? `<div class="cita">«${esc(d.cita)}»${d.minuto ? ` · ${esc(d.minuto)}` : ""}</div>` : ""}
      <div class="t-sub">${pill}${d.importancia === "alta" ? `<span class="pill red">Muy importante</span>` : ""}${clase ? `<a href="${urlClase(d.clase.id)}">${esc(a.nombre)} · ${esc(fmtFecha(d.clase.fecha))}</a>` : ""}</div></div><span></span></li>`;
}
function estadoClase(c) {
  if (c.en_curso) return `<span class="state live"><i></i>Grabando</span>`;
  if (resumiendo.has(c.id)) return `<span class="state wait"><i></i>Resumiendo</span>`;
  if (c.resumen) return `<span class="state"><i></i>Resumen listo</span>`;
  if (c.estado_resumen === "vacio") return `<span class="state none"><i></i>Sin contenido</span>`;
  if (c.estado_resumen === "error") return `<span class="state err"><i></i>Sin resumen</span>`;
  return `<span class="state wait"><i></i>Resumen pendiente</span>`;

  const por = horasPorDia(), N = 28, hoyD = hoy(), vals = [];

  const lun = lunes(new Date()), semana = CLASES.filter((c) => new Date(c.fecha + "T00:00") >= lun).reduce((s, c) => s + (c.duracion_s || 0), 0);

  const etiquetas = [0, 7, 14, 21, 27].map((i) => `<text x="${(pad + i * st).toFixed(0)}" y="${H - 4}" text-anchor="${i === 27 ? "end" : i ? "middle" : "start"}">${i === 27 ? "hoy" : vals[i].d.toLocaleDateString("es-ES", { day: "numeric", month: "short" })}</text>`).join("");
  return `<h2>Estadísticas <span>horas de clase grabadas, últimas 4 semanas</span></h2>${head}
    <svg class="area" viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas de clase grabadas por día en las últimas cuatro semanas; esta semana ${fmtH(semana)}."><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2563EB" stop-opacity=".28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>
    ${marcas.map((v) => `<line x1="${pad}" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" stroke="#E3EBF4"/><text x="${W - pad}" y="${y(v) - 5}" text-anchor="end">${v} h</text>`).join("")}
    <path d="${d} L${L[0].toFixed(1)} ${H - 22} L${pad} ${H - 22} Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#2563EB" stroke-width="2.5"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="5" fill="#2563EB" stroke="#fff" stroke-width="2"/>${etiquetas}</svg>`;
}

async function subirClase(c, antes) {
  const total = c.n_segmentos || 0, yaSubidos = antes ? (antes.n_segmentos || 0) : 0;
  if (total !== yaSubidos || !antes) {
    const desdeParte = antes && total > yaSubidos ? Math.floor(yaSubidos / POR_PARTE) : 0;
    let segs = [], desde = desdeParte * POR_PARTE, meta = null;
    while (true) {
      const r = await host("leer_clase", { id: c.id, desde });
      meta = r.clase; segs = segs.concat(r.segmentos);
      desde += r.segmentos.length;
      if (!r.segmentos.length || desde >= r.total) break;
    }
    for (let k = 0; k * POR_PARTE < segs.length; k++) {
      const parte = desdeParte + k;
      await db.doc(`clases/${c.id}/partes/p${String(parte).padStart(4, "0")}`).set({ k: parte, segmentos: segs.slice(k * POR_PARTE, (k + 1) * POR_PARTE) });
    }
  }
  const resumen = c.resumen || antes?.resumen || null;
  const doc = {
    id: c.id, asignatura: c.asignatura, nombre_asignatura: c.nombre_asignatura || "", aula: c.aula || "", modo: c.modo || "",
    fecha: c.fecha, inicio: c.inicio, fin: c.fin || null, en_curso: !!c.en_curso,
    n_segmentos: total, palabras: c.palabras || 0, duracion_s: c.duracion_s || 0,
    resumen, estado_resumen: resumen ? "listo" : c.estado_resumen, error_resumen: c.error_resumen || null,
    version: c.version, n_partes: Math.ceil(total / POR_PARTE), sincronizado: new Date().toISOString(),
  };
  await db.doc("clases/" + c.id).set(doc);
  MAPA[c.id] = doc;
}

async function leerTranscripcion(id) {

const INSTRUCCIONES = `Eres el asistente de estudio de un estudiante universitario.
Abajo tienes la transcripción automática de una clase grabada con el micrófono de su portátil. Tiene errores de reconocimiento, frases cortadas y ruido: interpreta con sentido común y no inventes nada que no se diga.

Responde SOLO con un objeto JSON con esta forma exacta:
{
  "titulo": "tema principal de la clase en pocas palabras",
  "resumen": "resumen COMPLETO de toda la clase (ver abajo), con \\n entre párrafos y líneas '## Tema' como títulos de sección",
  "puntos_clave": ["..."],
  "conceptos": [{"termino": "...", "explicacion": "..."}],
  "destacados": [{"tipo": "examen|trabajo|entrega|fecha|aviso|comentario", "titulo": "...", "detalle": "...", "fecha_iso": "AAAA-MM-DD o cadena vacía", "importancia": "alta|media", "minuto": "[mm:ss]", "cita": "frase literal o casi del profesor"}],

Lo importante va APARTE, en "destacados" (no basta con que esté en el resumen; puede estar en los dos).
Destacados: TODO lo que pueda importar para la nota.
- examen: exámenes, parciales, pruebas, qué entra, formato, si se puede llevar algo.
- trabajo / entrega: prácticas, proyectos, entregas, requisitos, fechas límite, cómo se entrega.
- fecha: fechas relevantes (clases que no hay, cambios de aula, tutorías…).
- aviso: cambios, normas, cosas que pide el profe.
- comentario: frases tipo "esto es importante", "esto entra", "fijaos bien", "esto lo pregunto siempre", pistas sobre el examen.
Importancia "alta" para exámenes, entregas con fecha y lo que el profesor diga que entra o es importante. Si no hay destacados, lista vacía: no rellenes por rellenar.
fecha_iso: convierte fechas relativas ("el jueves que viene", "dentro de dos semanas") usando la fecha de la clase; si no se puede saber, "".

function normalizar(r) {

async function resumirClase(c) {
  const segs = await leerTranscripcion(c.id);
  if (!segs.length) { await db.doc("clases/" + c.id).update({ estado_resumen: "vacio" }); return; }
  const ini = new Date(c.inicio);
  const texto = segs.map((s) => `[${mmss(s.ini)}] ${s.texto}`).join("\n");
  const entrada = `${INSTRUCCIONES}\n\nAsignatura: ${c.nombre_asignatura || asig(c.asignatura).nombre}\nFecha de la clase: ${DIAS[ini.getDay()]} ${c.fecha}, empezó a las ${fmtHora(c.inicio)}\n\nTranscripción:\n${texto}`;
  if (new Blob([entrada]).size > 250000) throw new Error("la transcripción es demasiado larga para resumirla de una vez");
  const r = normalizar(await sample.json(entrada, { modelTier: "default" }));

async function resumirPendientes() {

async function cargarSegs() {
  const c = MAPA[claseAbierta]; if (!c || !db) return;

}
function pintarTrans() {
  const t = $("#trans"), c = MAPA[claseAbierta]; if (!t || !c) return;
  const q = busq.trim().toLowerCase();
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  const marcas = new Set((c.resumen?.destacados || []).map((d) => str(d.minuto).replace(/[\[\]\s]/g, "")).filter(Boolean));
  const lista = q ? SEGS.filter((s) => s.texto.toLowerCase().includes(q)) : SEGS;

}
function enlazarClase(c) {
  const bu = $("#buscar"); if (bu) bu.oninput = (e) => { busq = e.target.value; pintarTrans(); };
  const rg = $("#regen");
  if (rg) rg.onclick = async () => {
    rg.disabled = true; resumiendo.add(c.id); pintarVista(true);
    try { await resumirClase(c); }
    catch (e) { resumiendo.delete(c.id); pintarVista(true); $("#accMsg") && ($("#accMsg").textContent = e && e.code === "not_granted" ? "No se ha dado permiso para usar Claude." : `No se pudo resumir: ${(e && e.message) || "error"}`); return; }
    resumiendo.delete(c.id); renderTodo();
  };

    const nueva = e.target.value, msg = () => $("#accMsg");
    if (nueva === c.asignatura) return;
    mv.disabled = true;
    if (msg()) msg().textContent = `Moviendo a ${asig(nueva).nombre}…`;
    try {
      await host("mover_clase", { id: c.id, asignatura: nueva });
      await db.doc("clases/" + c.id).update({ asignatura: nueva, nombre_asignatura: asig(nueva).nombre });
      if (MAPA[c.id]) { MAPA[c.id].asignatura = nueva; MAPA[c.id].nombre_asignatura = asig(nueva).nombre; }
      pintarVista(true);
      if (msg()) msg().textContent = `Movida a ${asig(nueva).nombre}.`;
      sincronizar();
    } catch (err) {
      mv.disabled = false; mv.value = c.asignatura;

    }

    bo.onclick = async () => {
      if (!armado) { armado = true; bo.textContent = "Pulsa otra vez para borrarla del todo"; setTimeout(() => { armado = false; bo.textContent = "Borrar clase"; }, 4000); return; }
      try {
        await host("borrar_clase", { id: c.id });

        for (const p of partes.docs) await db.doc(`clases/${c.id}/partes/${p.id}`).delete();

        location.hash = "#asig=" + encodeURIComponent(c.asignatura);

    };

}

let selFranja = null, diaMovil = null, mesOff = 0;

  <div class="grid">

function vStats() {
  const ids = asignaturasIds(), desde = hoy(); desde.setDate(desde.getDate() - 27);
  const per = ids.map((id) => [id, clasesDe(id).filter((c) => new Date(c.fecha + "T00:00") >= desde).reduce((s, c) => s + (c.duracion_s || 0), 0)]).filter(([, s]) => s).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...per.map(([, s]) => s));

  const datos = [
    mas ? `<li><b>${esc(asig(mas[0]).nombre)}</b>es la asignatura con más horas grabadas en las últimas cuatro semanas (${fmtH(mas[1])}).</li>` : "",

let rutaPintada = "", firmaClase = "";
function ruta() { return decodeURIComponent(location.hash.slice(1)) || "hoy"; }
function pintarVista(forzar) {
  if (!document.getElementById("app")) return;
  let h = ruta();
  // Enlaces antiguos: "#<id de clase>"
  if (MAPA[h] && !h.startsWith("clase=")) { history.replaceState(null, "", urlClase(h)); h = "clase=" + h; }
  let sec = "hoy", html;
  if (h.startsWith("clase=")) {
    const id = h.slice(6), c = MAPA[id];
    const firma = JSON.stringify([id, c?.version, c?.resumen?.generado, c?.asignatura, resumiendo.has(id), hostOK, !!sample, !!db, cargado, (c?.resumen?.destacados || []).map((_, i) => HECHOS.has(`${id}~${i}`))]);
    if (!forzar && rutaPintada === h && firma === firmaClase) { cargarSegs(); return; }
    firmaClase = firma; sec = "asignaturas";
    if (claseAbierta !== id) { claseAbierta = id; SEGS = []; segsVersion = ""; busq = ""; }
    html = vClase(id);
  } else {
    claseAbierta = null;
    if (h === "asignaturas") { sec = "asignaturas"; html = vAsig(); }
    else if (h.startsWith("asig=")) { sec = "asignaturas"; html = vSubject(h.slice(5)); }
    else if (h === "tareas") { sec = "tareas"; html = vTareas(); }
    else if (h === "calendario") { sec = "calendario"; html = vCal(); }
    else if (h === "estadisticas") { sec = "estadisticas"; html = vStats(); }
    else html = vHoy();
  }
  const y = scrollY, misma = rutaPintada === h;
  nav(sec); $("#app").innerHTML = html; rutaPintada = h;
  if (misma) scrollTo(0, y);
  if (claseAbierta) { pintarTrans(); enlazarClase(MAPA[claseAbierta] || {}); cargarSegs(); }
}
window.addEventListener("hashchange", () => { pintarVista(true); scrollTo(0, 0); });
$("#app").addEventListener("click", async (e) => {
  const h = e.target.closest("[data-hecho]");
  if (h && db) {
    const ref = db.doc("hechos/" + h.dataset.hecho), on = !HECHOS.has(h.dataset.hecho);
    on ? HECHOS.add(h.dataset.hecho) : HECHOS.delete(h.dataset.hecho); pintarVista(true);
    try { on ? await ref.set({ hecho: true, cuando: new Date().toISOString() }) : await ref.delete(); }
    catch (err) { on ? HECHOS.delete(h.dataset.hecho) : HECHOS.add(h.dataset.hecho); pintarVista(true); }
    return;
  }
  const f = e.target.closest("[data-f]"); if (f) { filtro = f.dataset.f; pintarVista(true); return; }
  const fr = e.target.closest("[data-franja]"); if (fr) { selFranja = fr.dataset.franja === "" ? null : +fr.dataset.franja; pintarVista(true); return; }
  const di = e.target.closest("[data-dia]"); if (di) { diaMovil = +di.dataset.dia; pintarVista(true); return; }
  const me = e.target.closest("[data-mes]"); if (me) { mesOff += +me.dataset.mes; pintarVista(true); return; }
});
// El sol avanza: se repinta Hoy cada minuto
setInterval(() => { if (!document.hidden && (ruta() === "hoy" || ruta() === "calendario")) pintarVista(true); }, 60000);

nav("hoy"); pintarVista(true); renderEstado();

  db = await claude.use("db");

  suscribir();
  sample = await claude.use("sample");

    if (modo === "mcp") arrancarSync();
  } else if (desktop?.fs) {
    await pasarAModoFs(false);
  } else {
    hostMsg = "Para traer clases nuevas, abre este panel en la app de Claude de tu ordenador (con Estudio instalado). Desde aquí ves lo ya sincronizado. [código: sin_mcp]";
  }
  if (!hostOK && !desktop?.fs) await ofrecerInstalar();
  await sugerirApp();
  renderTodo();
})();
