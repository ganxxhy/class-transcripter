name: Compilar Estudio

# - Cada push a main que toque la app: compila el instalador de Windows y el AppImage de Linux y los deja como artefactos.
# - Una etiqueta v1.2.3: además publica los dos en Releases (un solo trabajo, al final).
# - También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "agente/**"
      - "hub/**"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/compilar.yml"
  pull_request:
    paths:
      - "agente/**"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/compilar.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta existente para recuperar una release (vacío: prueba)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar referencia y versión
        id: ref
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ -n "$tag" && "$tag" != "$GITHUB_REF_NAME" ]]; then exit 1; fi
            tag="$GITHUB_REF_NAME"
          fi
          ref="$GITHUB_SHA"
          version="0.0.$GITHUB_RUN_NUMBER"
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            ref=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            version="${tag#v}"
          fi
          printf 'tag=%s\nref=%s\nversion=%s\n' "$tag" "$ref" "$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: preparar
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preparar.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r agente/requirements.txt pyinstaller

      - name: Pruebas
        shell: bash
        run: |
          python tests/test_horario.py
          python tests/test_resumen.py
          if [ -f tests/test_actualizacion.py ]; then python tests/test_actualizacion.py; fi

      - name: Versión
        id: version
        shell: bash
        run: |
          v="${{ needs.preparar.outputs.version }}"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Escribir la versión en la app
        shell: bash
        run: printf 'VERSION = "%s"\n' "${{ steps.version.outputs.v }}" > agente/version.py

      - name: Icono e imágenes del instalador
        run: python packaging/generar_imagenes.py

      - name: Compilar la app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name AgenteClases
          --icon packaging/build/icono.ico
          --paths agente
          --add-data "agente/asistente/asistente.html;asistente"
          --add-data "agente/asistente/actualizacion.html;asistente"
          --add-data "agente/config.ejemplo.json;."
          --collect-data faster_whisper
          --collect-binaries ctranslate2
          --collect-submodules webview
          --hidden-import pystray._win32
          --hidden-import asistente.asistente
          --hidden-import registrar_mcp
          --hidden-import actualizacion
          --hidden-import version
          agente/app.py

      - name: Compilar el servidor del hub (MCP)
        run: >
          pyinstaller --noconfirm --onefile --console
          --name agente-mcp
          --icon packaging/build/icono.ico
          --paths agente
          agente/mcp_servidor.py

      - name: Juntar
        shell: bash
        run: cp dist/agente-mcp.exe dist/AgenteClases/

      - name: Prueba rápida del .exe
        shell: bash
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-prueba
        run: |
          # El servidor MCP tiene que responder a initialize por stdio
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | dist/AgenteClases/agente-mcp.exe | tee salida.txt
          grep -q agente_clases salida.txt

      - name: Prueba del asistente (abre la ventana y se cierra sola)
        shell: pwsh
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}\datos-asistente
          AGENTE_CLASES_PRUEBA: "1"
        run: |
          $p = Start-Process dist\AgenteClases\AgenteClases.exe -ArgumentList "--asistente" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "El asistente se ha quedado colgado"; exit 1 }
          if (-not (Test-Path "$env:AGENTE_CLASES_DATOS\prueba-asistente.ok")) {
            Get-Content "$env:AGENTE_CLASES_DATOS\error.log" -ErrorAction SilentlyContinue
            Write-Error "El asistente no ha llegado a cargar"; exit 1
          }

      - name: Prueba de la búsqueda de actualizaciones (sin versión nueva no abre nada)
        shell: pwsh
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}\datos-actualizacion
        run: |
          $p = Start-Process dist\AgenteClases\AgenteClases.exe -ArgumentList "--buscar-actualizacion" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "La búsqueda de actualizaciones se ha quedado colgada"; exit 1 }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DVersion=${{ steps.version.outputs.v }} packaging\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-${{ steps.version.outputs.v }}-instalador
          path: dist/Estudio-*-instalador.exe
          if-no-files-found: error

  linux:
    needs: preparar
    runs-on: ubuntu-22.04  # una glibc antigua: así el AppImage funciona en más distribuciones
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preparar.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxkbfile1 python3-tk \
            pkg-config libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          # The windows use the system's WebKitGTK through PyGObject (3.50 is the last one for Ubuntu 22.04's GLib)
          pip install -r agente/requirements.txt pyinstaller "PyGObject<3.51"

      - name: Pruebas
        run: |
          python tests/test_horario.py
          python tests/test_linux.py
          python tests/test_resumen.py
          if [ -f tests/test_actualizacion.py ]; then python tests/test_actualizacion.py; fi

      - name: Versión
        id: version
        run: |
          v="${{ needs.preparar.outputs.version }}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          printf 'VERSION = "%s"\n' "$v" > agente/version.py

      - name: Icono
        run: python packaging/generar_imagenes.py

      - name: Compilar la app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name Estudio
          --paths agente
          --add-data "agente/asistente/asistente.html:asistente"
          --add-data "agente/asistente/actualizacion.html:asistente"
          --add-data "agente/config.ejemplo.json:."
          --add-binary "$(ldconfig -p | awk '/libportaudio.so.2 /{print $NF; exit}'):."
          --collect-data faster_whisper
          --collect-binaries ctranslate2
          --collect-submodules webview
          --collect-submodules pystray
          --hidden-import asistente.asistente
          --hidden-import registrar_mcp
          --hidden-import actualizacion
          --hidden-import version
          --hidden-import mcp_servidor
          --hidden-import linux_desktop
          agente/app.py

      - name: Recortar el AppImage (sin GTK propio: usa el WebKitGTK del sistema)
        run: bash packaging/linux/recortar.sh dist/Estudio

      - name: Montar el AppImage
        run: |
          v="${{ steps.version.outputs.v }}"
          mkdir -p AppDir/usr/lib
          cp -r dist/Estudio AppDir/usr/lib/estudio
          # The runner's libstdc++ is older than what Mesa drivers need on newer distros
          rm -f AppDir/usr/lib/estudio/_internal/libstdc++.so.6 AppDir/usr/lib/estudio/_internal/libgcc_s.so.1
          cp packaging/build/icono.png AppDir/estudio.png
          cat > AppDir/estudio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Estudio
          Comment=Graba, transcribe y resume tus clases
          Exec=Estudio
          Icon=estudio
          Categories=Education;AudioVideo;
          EOF
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/lib/estudio/Estudio" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          # Versión estable y verificación de integridad; reintentar errores transitorios (p. ej. HTTP 504).
          curl --fail --silent --show-error --location \
            --retry 5 --retry-connrefused --retry-max-time 300 \
            --connect-timeout 20 --max-time 120 \
            --output appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum --check
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Estudio-$v-x86_64.AppImage"

      - name: Prueba rápida del servidor MCP
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-prueba
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | ./Estudio-*-x86_64.AppImage --appimage-extract-and-run --mcp | tee salida.txt
          grep -q agente_clases salida.txt

      - name: Prueba del asistente (abre la ventana y se cierra sola)
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-asistente
          AGENTE_CLASES_PRUEBA: "1"
        run: |
          xvfb-run -a timeout 120 ./Estudio-*-x86_64.AppImage --appimage-extract-and-run --asistente || true
          if [ ! -f "$AGENTE_CLASES_DATOS/prueba-asistente.ok" ]; then
            cat "$AGENTE_CLASES_DATOS/error.log" 2>/dev/null || true
            echo "El asistente no ha llegado a cargar"; exit 1
          fi

      - name: Prueba de la búsqueda de actualizaciones (sin versión nueva no abre nada)
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-actualizacion
        run: xvfb-run -a timeout 60 ./Estudio-*-x86_64.AppImage --appimage-extract-and-run --buscar-actualizacion

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-${{ steps.version.outputs.v }}-appimage
          path: Estudio-*-x86_64.AppImage
          if-no-files-found: error

  publicar:
    if: needs.preparar.outputs.tag != ''
    needs: [preparar, windows, linux]
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.preparar.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preparar.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Validar instaladores y generar checksums
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          mkdir entrega
          cp "artefactos/Estudio-$VERSION-instalador/Estudio-$VERSION-instalador.exe" entrega/
          cp "artefactos/Estudio-$VERSION-appimage/Estudio-$VERSION-x86_64.AppImage" entrega/
          cd entrega
          test -s "Estudio-$VERSION-instalador.exe"
          test -s "Estudio-$VERSION-x86_64.AppImage"
          sha256sum *.exe *.AppImage > SHA256SUMS.txt
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
          SOURCE_SHA: ${{ needs.preparar.outputs.ref }}
        run: |
          v="${TAG#v}"
          # Confirmar que la etiqueta no ha cambiado desde la compilación.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
          if ! gh release view "$TAG" --json isDraft > release.json; then
            notas=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CAMBIOS.md | sed '/./,$!d')
            if [ -z "$notas" ]; then
              anterior=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
              rango=${anterior:+$anterior..}$TAG
              notas=$(git log "$rango" --merges --pretty='- %b' | grep -v '^- $' || true)
            fi
            printf '%s\n\nWindows: Estudio-%s-instalador.exe\n\nLinux: Estudio-%s-x86_64.AppImage (chmod +x).\n\nAntes de grabar una clase, pide permiso al profesorado y comprueba las normas de tu universidad.\n' "$notas" "$v" "$v" > notas.md
            gh release create "$TAG" --verify-tag --draft --title "Estudio $v" --notes-file notas.md
          fi
          gh release view "$TAG" --json name,body > metadata.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          tag = os.environ["TAG"]
          version = tag[1:]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases"
          metadata = json.loads(Path("metadata.json").read_text())
          manifest = {"schema": 1, "version": version, "titulo": metadata["name"],
                      "notas": metadata["body"], "url": f"{base}/tag/{tag}"}
          for platform, name in (("windows", f"Estudio-{version}-instalador.exe"),
                                 ("linux", f"Estudio-{version}-x86_64.AppImage")):
              path = Path("entrega") / name
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              manifest[platform] = {"url": f"{base}/download/{tag}/{name}",
                                    "sha256": digest, "size": path.stat().st_size}
          Path("entrega/update.json").write_text(json.dumps(manifest, ensure_ascii=False), encoding="utf-8")
          PY
          gh release upload "$TAG" entrega/*.exe entrega/*.AppImage entrega/SHA256SUMS.txt --clobber
          gh release upload "$TAG" entrega/update.json --clobber
          gh release view "$TAG" --json assets > assets.json
          for archivo in entrega/*; do
            nombre=$(basename "$archivo")
            tamano=$(stat -c %s "$archivo")
            jq -e --arg n "$nombre" --argjson s "$tamano" '.assets | any(.name == $n and .size == $s)' assets.json
          done
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
