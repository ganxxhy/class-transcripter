name: Compilar Estudio

# - Cada push a main que toque la app: compila el instalador de Windows y el AppImage de Linux y los deja como artefactos.
# - Una etiqueta v1.2.3: además publica los dos en Releases (un solo trabajo, al final).
# - También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "agente/**"
      - "hub/**"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/compilar.yml"
  pull_request:
    paths:
      - "agente/**"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/compilar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # las etiquetas hacen falta para las notas de la versión

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r agente/requirements.txt pyinstaller

      - name: Pruebas
        run: |
          python tests/test_horario.py
          python tests/test_resumen.py

      - name: Versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Escribir la versión en la app
        shell: bash
        run: printf 'VERSION = "%s"\n' "${{ steps.version.outputs.v }}" > agente/version.py

      - name: Icono e imágenes del instalador
        run: python packaging/generar_imagenes.py

      - name: Compilar la app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name AgenteClases
          --icon packaging/build/icono.ico
          --paths agente
          --add-data "agente/asistente/asistente.html;asistente"
          --add-data "agente/asistente/actualizacion.html;asistente"
          --add-data "agente/config.ejemplo.json;."
          --collect-data faster_whisper
          --collect-binaries ctranslate2
          --collect-submodules webview
          --hidden-import pystray._win32
          --hidden-import asistente.asistente
          --hidden-import registrar_mcp
          --hidden-import actualizacion
          --hidden-import version
          agente/app.py

      - name: Compilar el servidor del hub (MCP)
        run: >
          pyinstaller --noconfirm --onefile --console
          --name agente-mcp
          --icon packaging/build/icono.ico
          --paths agente
          agente/mcp_servidor.py

      - name: Juntar
        shell: bash
        run: cp dist/agente-mcp.exe dist/AgenteClases/

      - name: Prueba rápida del .exe
        shell: bash
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-prueba
        run: |
          # El servidor MCP tiene que responder a initialize por stdio
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | dist/AgenteClases/agente-mcp.exe | tee salida.txt
          grep -q agente_clases salida.txt

      - name: Prueba del asistente (abre la ventana y se cierra sola)
        shell: pwsh
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}\datos-asistente
          AGENTE_CLASES_PRUEBA: "1"
        run: |
          $p = Start-Process dist\AgenteClases\AgenteClases.exe -ArgumentList "--asistente" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "El asistente se ha quedado colgado"; exit 1 }
          if (-not (Test-Path "$env:AGENTE_CLASES_DATOS\prueba-asistente.ok")) {
            Get-Content "$env:AGENTE_CLASES_DATOS\error.log" -ErrorAction SilentlyContinue
            Write-Error "El asistente no ha llegado a cargar"; exit 1
          }

      - name: Prueba de la búsqueda de actualizaciones (sin versión nueva no abre nada)
        shell: pwsh
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}\datos-actualizacion
        run: |
          $p = Start-Process dist\AgenteClases\AgenteClases.exe -ArgumentList "--buscar-actualizacion" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "La búsqueda de actualizaciones se ha quedado colgada"; exit 1 }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DVersion=${{ steps.version.outputs.v }} packaging\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-${{ steps.version.outputs.v }}-instalador
          path: dist/Estudio-*-instalador.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04  # una glibc antigua: así el AppImage funciona en más distribuciones
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxkbfile1 python3-tk

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r agente/requirements.txt pyinstaller

      - name: Pruebas
        run: |
          python tests/test_horario.py
          python tests/test_linux.py

      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          printf 'VERSION = "%s"\n' "$v" > agente/version.py

      - name: Icono
        run: python packaging/generar_imagenes.py

      - name: Compilar la app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name Estudio
          --paths agente
          --add-data "agente/asistente/asistente.html:asistente"
          --add-data "agente/asistente/actualizacion.html:asistente"
          --add-data "agente/config.ejemplo.json:."
          --add-binary "$(ldconfig -p | awk '/libportaudio.so.2 /{print $NF; exit}'):."
          --collect-data faster_whisper
          --collect-binaries ctranslate2
          --collect-submodules webview
          --collect-submodules pystray
          --hidden-import asistente.asistente
          --hidden-import registrar_mcp
          --hidden-import actualizacion
          --hidden-import version
          --hidden-import mcp_servidor
          --hidden-import linux_desktop
          agente/app.py

      - name: Montar el AppImage
        run: |
          v="${{ steps.version.outputs.v }}"
          mkdir -p AppDir/usr/lib
          cp -r dist/Estudio AppDir/usr/lib/estudio
          cp packaging/build/icono.png AppDir/estudio.png
          cat > AppDir/estudio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Estudio
          Comment=Graba, transcribe y resume tus clases
          Exec=Estudio
          Icon=estudio
          Categories=Education;AudioVideo;
          EOF
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/lib/estudio/Estudio" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Estudio-$v-x86_64.AppImage"

      - name: Prueba rápida del servidor MCP
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-prueba
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | ./Estudio-*-x86_64.AppImage --appimage-extract-and-run --mcp | tee salida.txt
          grep -q agente_clases salida.txt

      - name: Prueba del asistente (abre la ventana y se cierra sola)
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-asistente
          AGENTE_CLASES_PRUEBA: "1"
        run: |
          xvfb-run -a timeout 120 ./Estudio-*-x86_64.AppImage --appimage-extract-and-run --asistente || true
          if [ ! -f "$AGENTE_CLASES_DATOS/prueba-asistente.ok" ]; then
            cat "$AGENTE_CLASES_DATOS/error.log" 2>/dev/null || true
            echo "El asistente no ha llegado a cargar"; exit 1
          fi

      - name: Prueba de la búsqueda de actualizaciones (sin versión nueva no abre nada)
        env:
          AGENTE_CLASES_DATOS: ${{ runner.temp }}/datos-actualizacion
        run: xvfb-run -a timeout 60 ./Estudio-*-x86_64.AppImage --appimage-extract-and-run --buscar-actualizacion

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-${{ steps.version.outputs.v }}-appimage
          path: Estudio-*-x86_64.AppImage
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # las etiquetas hacen falta para las notas de la versión

      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Notas: la sección "## v" de CAMBIOS.md; si no hay, los títulos de las PR desde la versión anterior
          notas=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CAMBIOS.md | sed '/./,$!d')
          if [ -z "$notas" ]; then
            anterior=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            rango=${anterior:+$anterior..}$GITHUB_REF_NAME
            notas=$(git log "$rango" --merges --pretty='- %b' | grep -v '^- $' || true)
          fi
          printf '%s\n\n---\n**Windows:** descarga **Estudio-%s-instalador.exe**, ábrelo y sigue los pasos (Windows 10 u 11 de 64 bits).\n\n**Linux:** descarga **Estudio-%s-x86_64.AppImage**, hazlo ejecutable (`chmod +x`) y ábrelo.\n\nSi ya lo tienes, la app te avisará y se actualizará sola.\n\nAntes de grabar una clase, pide permiso al profesorado y comprueba las normas de tu universidad.\n' "$notas" "$v" "$v" > notas.md
          gh release create "$GITHUB_REF_NAME" artefactos/*/*.exe artefactos/*/*.AppImage --title "Estudio $v" --notes-file notas.md
